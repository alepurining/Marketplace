{% extends 'base.html' %}

{% block title %}Registrar Clientes{% endblock %}

{% block content %}

<div class="caja-detalle mx-auto" style="max-width: 600px;">

    <h1>Registrar Cliente</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{% url 'listaclientes' %}" class="btn-eliminar">
                Cancelar
            </a>

            <button type="submit" class="btn-registrar">
                Registrar
            </button>
        </div>

    </form>

</div>

{% endblock %}
